<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>ITパスポート学習室</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#19343d;background:#f3f7f7}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(96px + env(safe-area-inset-bottom))}header{padding:25px 0 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:19px;margin:4px 0 16px}p{line-height:1.7}.muted{color:#65777c;font-size:13px}.tag{font-size:12px;background:#dceceb;border-radius:99px;padding:6px 10px}.card{background:white;border-radius:19px;padding:20px;margin:14px 0;box-shadow:0 4px 24px #173e4910}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border-radius:16px;padding:14px 6px;text-align:center}.stat strong{display:block;font-size:25px;margin:5px}.stat small{font-size:11px;color:#687b80}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{border:0;border-radius:13px;background:#126d78;color:white;padding:15px;font-weight:700;width:100%;margin-top:12px}.secondary{background:#e9f1f1;color:#1a5862;border:0;border-radius:12px;padding:12px}.choice{width:100%;border:2px solid #e4ecec;border-radius:13px;background:white;text-align:left;padding:15px;margin:6px 0;line-height:1.5}.choice.selected{border-color:#137784;background:#edf8f8}.choice.correct{border-color:#25986e;background:#e9f7ee}.choice.wrong{border-color:#ce6363;background:#fff0f0}.choice b{display:inline-block;width:30px}.feedback{border-radius:13px;background:#f0f6f5;padding:15px;margin-top:14px}.bar{height:12px;background:#e6eded;border-radius:99px;overflow:hidden}.fill{height:100%;background:#1a8591;border-radius:99px}.barrow{margin:15px 0}.barlabel{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e2e9e9;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}nav button{flex:1;max-width:190px;border:0;border-radius:12px;padding:11px 4px;background:transparent;color:#687b80;font-size:13px}nav button.active{background:#dff0ef;color:#075e69;font-weight:700}.hide{display:none!important}select{padding:12px;border:1px solid #d6e3e3;border-radius:11px;background:white;width:100%;margin:5px 0 10px}.pill{font-size:12px;color:#237580}.note{background:#fff9e7;padding:13px;border-radius:12px;font-size:12px;line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.history{border-bottom:1px solid #edf0f0;padding:11px 0;font-size:13px}.empty{padding:25px;text-align:center;color:#77898c}
</style></head><body><div class="app"><header><div><div class="muted">毎日少しずつ、合格に近づこう</div><h1>📘 ITパスポート学習室</h1></div><span class="tag">v0.2 試作版</span></header><main id="home"><div class="stats"><div class="stat"><small>解答数</small><strong id="total">0</strong></div><div class="stat"><small>正答率</small><strong id="accuracy">—</strong></div><div class="stat"><small>復習待ち</small><strong id="reviewCount">0</strong></div></div><div class="card"><h2>今日の学習を始めよう</h2><p class="muted">分野を選んで問題を解こう。解説を読んだあと、間違えた問題は復習に追加されるよ。</p><label for="category">出題ジャンル</label><select id="category"><option value="all">全ジャンル</option><option value="ストラテジ系">ストラテジ系</option><option value="マネジメント系">マネジメント系</option><option value="テクノロジ系">テクノロジ系</option></select><button class="primary" id="start">問題演習を始める →</button><button class="secondary" style="width:100%;margin-top:10px" id="startReview">間違えた問題を復習する</button></div><div class="note">この版は学習用のオリジナル例題を収録しています。IPA公式過去問ではありません。解説は事前作成した固定文章で、AIへの接続はまだありません。</div></main><main id="quiz" class="hide"><div class="card"><div class="row"><span class="pill" id="quizCat"></span><span class="muted" id="quizProgress"></span></div><h2 id="question" style="margin-top:20px;line-height:1.6"></h2><div id="choices"></div><div id="feedback" class="feedback hide"></div><button id="submit" class="primary" disabled>解答する</button><button id="next" class="primary hide">次の問題へ →</button><button id="quit" class="secondary" style="width:100%;margin-top:10px">学習を終了</button></div></main><main id="analytics" class="hide"><div class="card"><h2>分野別の正答率</h2><p class="muted">実際の解答履歴から自動集計します。</p><div id="bars"></div></div><div class="card"><h2>最近の学習履歴</h2><div id="history"></div></div><div class="card"><h2>データのバックアップ</h2><p class="muted">この端末のブラウザに保存中。データ消去や端末変更に備えてJSONで書き出せます。</p><button class="secondary" id="export">履歴をエクスポート</button><label class="secondary" style="display:inline-block;margin-top:8px;cursor:pointer">履歴をインポート<input id="import" type="file" accept="application/json" hidden></label></div></main></div><nav><button data-page="home" class="active">⌂<br>ホーム</button><button data-page="quiz">✎<br>問題演習</button><button data-page="analytics">▥<br>成績分析</button></nav><script>
const questions=[
{id:'s1',cat:'ストラテジ系',topic:'経営戦略',q:'企業の強み・弱みと、外部環境の機会・脅威を整理する分析手法はどれか。',a:['SWOT分析','PPM分析','ABC分析','PERT'],correct:0,ex:'SWOT分析は内部の強み・弱み、外部の機会・脅威を整理します。PPMは事業ポートフォリオ、ABC分析は重要度による分類、PERTは工程管理に用います。'},
{id:'s2',cat:'ストラテジ系',topic:'法務',q:'著作権について、一般に正しい説明はどれか。',a:['登録しなければ発生しない','創作した時点で原則として発生する','アイデアそのものを必ず保護する','保護期間は必ず5年間'],correct:1,ex:'著作権は著作物を創作した時点で原則として自動的に発生します。単なるアイデア自体ではなく、創作的な表現を保護します。'},
{id:'s3',cat:'ストラテジ系',topic:'財務',q:'売上高から売上原価を差し引いた利益を何というか。',a:['営業利益','経常利益','売上総利益','当期純利益'],correct:2,ex:'売上総利益（粗利益）＝売上高−売上原価です。営業利益はそこから販売費および一般管理費を差し引きます。'},
{id:'m1',cat:'マネジメント系',topic:'プロジェクト管理',q:'PDCAサイクルのCは何を意味するか。',a:['Create','Control','Check','Change'],correct:2,ex:'PDCAはPlan（計画）、Do（実行）、Check（評価）、Act（改善）です。'},
{id:'m2',cat:'マネジメント系',topic:'サービス管理',q:'SLAの説明として最も適切なものはどれか。',a:['サービス提供者と利用者が合意するサービス水準','ソフトウェアの著作権表示','開発工程の作業分解図','企業の会計基準'],correct:0,ex:'SLA（Service Level Agreement）はサービスの品質や可用性などについて、提供者と利用者が合意する取り決めです。'},
{id:'m3',cat:'マネジメント系',topic:'プロジェクト管理',q:'WBSの主な目的はどれか。',a:['暗号鍵を管理する','作業を階層的に分解し管理する','顧客満足度を計測する','ネットワークの通信を暗号化する'],correct:1,ex:'WBS（Work Breakdown Structure）はプロジェクトの成果物や作業を細分化し、見積りや進捗管理に役立てます。'},
{id:'t1',cat:'テクノロジ系',topic:'データベース',q:'関係データベースの表で、各行を一意に識別するためのキーはどれか。',a:['外部キー','主キー','索引','ビュー'],correct:1,ex:'主キーは行を一意に識別する列または列の組合せです。重複値やNULL値は許されません。'},
{id:'t2',cat:'テクノロジ系',topic:'セキュリティ',q:'情報セキュリティの三要素（CIA）に含まれないものはどれか。',a:['機密性','完全性','可用性','拡張性'],correct:3,ex:'CIAはConfidentiality（機密性）、Integrity（完全性）、Availability（可用性）の3つです。'},
{id:'t3',cat:'テクノロジ系',topic:'ネットワーク',q:'DNSの主な役割はどれか。',a:['ドメイン名とIPアドレスを対応付ける','ファイルを圧縮する','画面を描画する','電源を制御する'],correct:0,ex:'DNSはドメイン名からIPアドレスを調べる名前解決などを担う仕組みです。'}];
const KEY='itpassport-v02-history';let records=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))records=x}catch{}let queue=[],idx=0,selected=-1,answered=false;
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(records))}function wrongIds(){const latest=new Map();records.forEach(r=>latest.set(r.id,r.ok));return [...latest].filter(([id,ok])=>!ok&&questions.some(q=>q.id===id)).map(([id])=>id)}function renderHome(){const n=records.length;$('total').textContent=n;$('accuracy').textContent=n?Math.round(records.filter(r=>r.ok).length/n*100)+'%':'—';$('reviewCount').textContent=wrongIds().length;$('startReview').disabled=!wrongIds().length}function page(p){['home','quiz','analytics'].forEach(id=>$(id).classList.toggle('hide',id!==p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')renderHome();if(p==='analytics')renderAnalytics();if(p==='quiz'&&!queue.length)start(false);scrollTo(0,0)}function start(review){queue=review?questions.filter(q=>wrongIds().includes(q.id)):questions.filter(q=>$('category').value==='all'||q.cat===$('category').value);queue=[...queue].sort(()=>Math.random()-.5);if(!queue.length){alert('対象の問題がありません');return}idx=0;draw();page('quiz')}function draw(){selected=-1;answered=false;const q=queue[idx];$('quizCat').textContent=q.cat+' / '+q.topic;$('quizProgress').textContent=`${idx+1} / ${queue.length}`;$('question').textContent=q.q;$('choices').replaceChildren();q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+String.fromCharCode(65+i)+'</b>';b.append(document.createTextNode(a));b.onclick=()=>{if(answered)return;selected=i;document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',i===j));$('submit').disabled=false};$('choices').append(b)});$('feedback').classList.add('hide');$('submit').classList.remove('hide');$('submit').disabled=true;$('next').classList.add('hide')}
$('submit').onclick=()=>{if(selected<0||answered)return;answered=true;const q=queue[idx],ok=selected===q.correct;records.push({id:q.id,cat:q.cat,topic:q.topic,ok,selected,at:new Date().toISOString()});save();document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q.correct);b.classList.toggle('wrong',i===selected&&!ok)});$('feedback').replaceChildren();const title=document.createElement('strong');title.textContent=ok?'✓ 正解！':'✕ 不正解';const p=document.createElement('p');p.textContent=q.ex;$('feedback').append(title,p);$('feedback').classList.remove('hide');$('submit').classList.add('hide');$('next').classList.remove('hide');$('next').textContent=idx===queue.length-1?'演習を終了':'次の問題へ →'};
$('next').onclick=()=>{idx++;if(idx>=queue.length){queue=[];page('analytics')}else{draw();scrollTo(0,0)}};$('quit').onclick=()=>{queue=[];page('home')};$('start').onclick=()=>start(false);$('startReview').onclick=()=>start(true);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));function renderAnalytics(){const root=$('bars');root.replaceChildren();['ストラテジ系','マネジメント系','テクノロジ系'].forEach(cat=>{const rs=records.filter(r=>r.cat===cat),pct=rs.length?Math.round(rs.filter(r=>r.ok).length/rs.length*100):0;const wrap=document.createElement('div');wrap.className='barrow';const lbl=document.createElement('div');lbl.className='barlabel';const a=document.createElement('span');a.textContent=cat;const b=document.createElement('strong');b.textContent=rs.length?`${pct}% (${rs.filter(r=>r.ok).length}/${rs.length})`:'未解答';lbl.append(a,b);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);wrap.append(lbl,bar);root.append(wrap)});const hist=$('history');hist.replaceChildren();if(!records.length){const e=document.createElement('div');e.className='empty';e.textContent='まだ解答履歴がありません';hist.append(e)}else records.slice(-15).reverse().forEach(r=>{const div=document.createElement('div');div.className='history';const q=questions.find(q=>q.id===r.id);div.textContent=`${r.ok?'✓':'✕'} ${q?.topic||r.topic||r.id} · ${new Date(r.at).toLocaleString('ja-JP')}`;hist.append(div)})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='itpassport-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.records)||!x.records.every(r=>typeof r.id==='string'&&typeof r.ok==='boolean'&&typeof r.at==='string'))throw Error();if(!confirm('現在の履歴をインポートした履歴で置き換えますか？'))return;records=x.records;save();renderAnalytics();renderHome();alert('インポートしました')}catch{alert('有効な履歴ファイルではありません')}e.target.value=''};renderHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
